<!-- ============================================================ entrar -->
<main id="acceso" class="acceso" hidden>
  <div class="acceso-cielo" aria-hidden="true">
    <span class="nubecilla n1"></span><span class="nubecilla n2"></span><span class="nubecilla n3"></span>
  </div>
  <section class="acceso-tarjeta">
    <img src="/icono.svg" alt="" width="64" height="64" class="acceso-logo">
    <h1 class="acceso-titulo">scloud</h1>
    <p class="acceso-sub">Tus archivos en tu propia nube: súbelos, compártelos y tenlos iguales en todos tus equipos.</p>
    <div class="conmutador" role="tablist" aria-label="Entrar o crear cuenta">
      <button role="tab" aria-selected="true" data-modo="entrar">Entrar</button>
      <button role="tab" aria-selected="false" data-modo="registro">Crear cuenta</button>
      <span class="conmutador-gota" aria-hidden="true"></span>
    </div>
    <form id="form-acceso" class="formulario" novalidate>
      <label class="campo solo-registro" hidden>
        <span>Tu nombre</span>
        <input name="nombre" autocomplete="name" maxlength="60" placeholder="Como quieras que te vean">
      </label>
      <label class="campo">
        <span>Usuario</span>
        <input name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="32">
        <small class="solo-registro ayuda" hidden>Con él te encuentran para compartir. Letras, números, punto y guion bajo.</small>
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input name="clave" type="password" autocomplete="current-password" required minlength="8">
        <small class="solo-registro ayuda" hidden>Al menos 8 caracteres.</small>
      </label>
      <p class="error-form" role="alert" hidden></p>
      <button class="boton primario ancho" type="submit"><span>Entrar en mi nube</span></button>
    </form>
    <p class="acceso-pie">Qué se guarda y quién puede verlo: <a href="/privacidad">privacidad</a>.</p>
  </section>
</main>

<!-- ============================================================== app -->
<div id="app" class="app" hidden>
  <header class="membrete">
    <a class="marca" href="#/" aria-label="scloud, ir a Mi nube">
      <img src="/icono.svg" alt="" width="34" height="34"><span>scloud</span>
    </a>
    <form class="buscador" role="search" id="form-buscar">
      <svg class="ico"><use href="#i-buscar"/></svg>
      <input type="search" id="buscar" placeholder="Buscar en mi nube" aria-label="Buscar en mi nube" autocomplete="off">
    </form>
    <button class="cuota" id="cuota" type="button" aria-label="Espacio usado">
      <span class="gota-nivel" aria-hidden="true"><span class="agua"></span></span>
      <span class="cuota-texto"><b id="cuota-usado">—</b><small id="cuota-total"></small></span>
    </button>
    <div class="cuenta">
      <button class="avatar" id="avatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Tu cuenta"></button>
      <div class="menu" id="menu-cuenta" role="menu" hidden>
        <p class="menu-quien"><b id="menu-nombre"></b><small id="menu-usuario"></small></p>
        <button role="menuitem" data-accion="clave"><svg class="ico"><use href="#i-llave"/></svg>Cambiar contraseña</button>
        <button role="menuitem" data-accion="tema"><svg class="ico"><use href="#i-luna"/></svg><span id="tema-texto">Cielo de noche</span></button>
        <button role="menuitem" data-accion="sesiones"><svg class="ico"><use href="#i-candado"/></svg>Cerrar las demás sesiones</button>
        <a role="menuitem" href="/privacidad" target="_blank" rel="noopener"><svg class="ico"><use href="#i-candado"/></svg>Privacidad</a>
        <button role="menuitem" data-accion="salir"><svg class="ico"><use href="#i-salir"/></svg>Salir</button>
        <hr>
        <button role="menuitem" data-accion="borrar-cuenta" class="peligro"><svg class="ico"><use href="#i-papelera"/></svg>Borrar mi cuenta</button>
      </div>
    </div>
  </header>

  <nav class="espacios" aria-label="Secciones">
    <a href="#/" data-vista="nube"><svg class="ico"><use href="#i-nube"/></svg><span>Mi nube</span></a>
    <a href="#/recientes" data-vista="recientes"><svg class="ico"><use href="#i-reloj"/></svg><span>Recientes</span></a>
    <a href="#/compartido" data-vista="compartido"><svg class="ico"><use href="#i-personas"/></svg><span>Compartido</span></a>
    <a href="#/enlaces" data-vista="enlaces"><svg class="ico"><use href="#i-enlace"/></svg><span>Enlaces</span></a>
    <a href="#/equipos" data-vista="equipos"><svg class="ico"><use href="#i-equipo"/></svg><span>Equipos</span></a>
    <a href="#/papelera" data-vista="papelera"><svg class="ico"><use href="#i-papelera"/></svg><span>Papelera</span></a>
    <span class="espacios-gota" aria-hidden="true"></span>
  </nav>

  <main id="contenido" class="hoja" tabindex="-1">
    <div class="hoja-cabeza">
      <div class="hoja-titulos">
        <nav class="migas" id="migas" aria-label="Estás en"></nav>
        <h1 id="titulo">Mi nube</h1>
        <p class="hoja-nota" id="nota" hidden></p>
      </div>
      <div class="acciones" id="acciones"></div>
    </div>
    <div id="vista" class="vista"></div>
  </main>

  <div class="barra-seleccion" id="seleccion" hidden>
    <span id="sel-cuenta"></span>
    <button class="boton suave" data-sel="bajar"><svg class="ico"><use href="#i-bajar"/></svg><span>Descargar</span></button>
    <button class="boton suave" data-sel="mover"><svg class="ico"><use href="#i-mover"/></svg><span>Mover</span></button>
    <button class="boton suave peligro" data-sel="papelera"><svg class="ico"><use href="#i-papelera"/></svg><span>A la papelera</span></button>
    <button class="boton icono" data-sel="limpiar" aria-label="Quitar la selección"><svg class="ico"><use href="#i-cerrar"/></svg></button>
  </div>

  <aside class="lluvia" id="lluvia" aria-label="Transferencias" hidden>
    <button class="lluvia-resumen" id="lluvia-resumen" aria-expanded="false" aria-controls="lluvia-lista">
      <span class="gota-nivel grande" aria-hidden="true"><span class="agua"></span></span>
      <span class="lluvia-texto"><b id="lluvia-titulo"></b><small id="lluvia-sub"></small></span>
    </button>
    <ul class="lluvia-lista" id="lluvia-lista" hidden></ul>
  </aside>

  <div class="soltar" id="soltar" hidden aria-hidden="true">
    <div class="soltar-nube">
      <svg viewBox="0 0 24 24"><use href="#i-nube"/></svg>
      <p>Suéltalos en <b id="soltar-donde">Mi nube</b></p>
    </div>
  </div>

  <dialog id="dialogo" class="dialogo"></dialog>
  <div class="menu flotante" id="menu-nodo" role="menu" hidden></div>
  <input type="file" id="elegir-archivos" multiple hidden>
  <input type="file" id="elegir-carpeta" webkitdirectory hidden>
</div>

<div class="avisos" id="avisos" aria-live="polite"></div>
</body>
</html>
