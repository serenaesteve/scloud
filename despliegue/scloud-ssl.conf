# scloud.serenaesteve.com: Apache pone el TLS y reenvía a la web de scloud en 127.0.0.1:8104.
# El canal de los equipos (8105) no pasa por aquí: va directo, con su propio TLS.
<VirtualHost *:443>
    ServerName scloud.serenaesteve.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/scloud.serenaesteve.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/scloud.serenaesteve.com/privkey.pem

    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyPreserveHost On

    # Subidas grandes: sin el límite de 1 GB que trae Apache (la cuota la pone scloud)
    LimitRequestBody 0
    # Ni comprimir ni acumular la API: las descargas y los ZIP van en streaming
    SetEnvIf Request_URI "^/api/" no-gzip=1

    # Los avisos en directo (Server-Sent Events): cada trozo, en cuanto llega.
    # scloud manda un latido cada 20 s, así que una conexión callada 60 s está muerta.
    ProxyPass /api/eventos http://127.0.0.1:8104/api/eventos flushpackets=on timeout=60
    ProxyPass / http://127.0.0.1:8104/ timeout=900
    ProxyPassReverse / http://127.0.0.1:8104/

    ErrorLog ${APACHE_LOG_DIR}/scloud-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/scloud-ssl-access.log combined
</VirtualHost>
