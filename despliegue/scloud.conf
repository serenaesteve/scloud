# scloud.serenaesteve.com en el puerto 80: solo la verificación de Let's Encrypt y la redirección a HTTPS.
<VirtualHost *:80>
    ServerName scloud.serenaesteve.com

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://scloud.serenaesteve.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/scloud-error.log
    CustomLog ${APACHE_LOG_DIR}/scloud-access.log combined
</VirtualHost>
